<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Minimalist Pomodoro Timer — Focus deeply, break wisely.">
  <meta name="theme-color" content="#0a0a0a">
  <title>Pomodoro — Focus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- WebGL fluid / gas dynamics background -->
  <canvas id="fluidCanvas"></canvas>

  <!-- Content overlay -->
  <div class="app" id="app">

    <!-- Top bar — minimal -->
    <header class="topbar">
      <span class="topbar-left">
        <span class="mode-pill" id="modePill">
          <span class="mode-dot"></span>
          <span class="mode-pill-text" id="modePillText">Focus</span>
        </span>
      </span>
      <span class="topbar-center">
        <span class="logo-mark">POMODORO</span>
      </span>
      <span class="topbar-right">
        <span class="session-tracker" id="sessionTracker">
          <span class="session-dot active"></span>
          <span class="session-dot"></span>
          <span class="session-dot"></span>
          <span class="session-dot"></span>
        </span>
      </span>
    </header>

    <!-- Main — vertically centered dashboard -->
    <main class="dashboard">

      <!-- Greeting + Clock (Flocus-style) -->
      <div class="greeting-block" id="greetingBlock">
        <p class="greeting-text" id="greetingText">Good afternoon.</p>
        <h1 class="clock" id="clock">4:20 PM</h1>
      </div>

      <!-- Timer display (replaces clock during active session) -->
      <div class="timer-block" id="timerBlock">
        <div class="timer-ring-wrap">
          <svg class="timer-svg" viewBox="0 0 340 340" aria-hidden="true">
            <circle class="ring-track" cx="170" cy="170" r="156" />
            <circle class="ring-progress" id="ringProgress" cx="170" cy="170" r="156" />
          </svg>
          <div class="timer-inner">
            <span class="timer-time" id="timerTime">25:00</span>
            <span class="timer-label" id="timerLabel">focus</span>
          </div>
        </div>
      </div>

      <!-- Quote -->
      <div class="quote-block" id="quoteBlock">
        <p class="quote-text" id="quoteText">"The secret of getting ahead is getting started."</p>
        <p class="quote-author" id="quoteAuthor">Mark Twain</p>
      </div>

      <!-- Controls -->
      <div class="controls" id="controls">
        <button class="ctrl-btn ctrl-secondary" id="resetBtn" title="Reset (R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
        <button class="ctrl-btn ctrl-primary" id="startBtn" title="Start / Pause (Space)">
          <!-- Play icon -->
          <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
          <!-- Pause icon (hidden by default) -->
          <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"></rect><rect x="15" y="3" width="4" height="18"></rect></svg>
        </button>
        <button class="ctrl-btn ctrl-secondary" id="skipBtn" title="Skip (S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
      </div>

    </main>

    <!-- Keyboard hint (desktop only) -->
    <footer class="hint-bar">
      <span class="hint"><kbd>Space</kbd> play / pause</span>
      <span class="hint"><kbd>R</kbd> reset</span>
      <span class="hint"><kbd>S</kbd> skip</span>
    </footer>

  </div>

  <script src="fluid.js"></script>
  <script src="script.js"></script>
</body>
</html>
